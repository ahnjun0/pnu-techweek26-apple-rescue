# 대회 환경 — uv 로 관리한다.
#
#   uv sync                 # 이것 하나로 끝 — Webots 컨트롤러도 이 .venv 를 쓴다
#                           # (controllers/*/runtime.ini 의 [python] COMMAND)
#
# ⚠️ 버전은 **시험이 통과하고 apartment 를 측정한 ~/webots-env 의 버전 그대로** 고정했다.
#    대회 당일에 버전이 바뀌면 결과가 달라질 수 있으므로 올리지 않는다.
# ⚠️ Python 3.10: 계획안이 "Ubuntu 22.04 & Python 3.10 기준" 이라고 명시한다.

[project]
name = "robot-hack-sar"
version = "0.1.0"
description = "PNU TECH WEEK 2026 — AMR Search and Rescue (Webots)"
requires-python = "==3.10.*"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==5.0.0.93",
    "matplotlib==3.10.9",
    # 사과 확인용 YOLO11n (9/30 부터 기본). ⚠️ ultralytics 최신판은 numpy 2.2 를 받지 않아
    # numpy 를 1.26 으로 내린다 — 8.4.123 은 2.2.6 과 함께 풀린다 (uv.lock 이 확인).
    "torch==2.14.0",
    "ultralytics==8.4.123",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false          # 설치할 패키지가 아니라 스크립트 모음이다
